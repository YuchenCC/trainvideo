<!DOCTYPE html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #f8fafc;
        --bg-panel: #ffffff;
        --ink: #111827;
        --text: #374151;
        --muted: #6b7280;
        --line: #e5e7eb;
        --blue: #2563eb;
        --blue-strong: #1677ff;
        --purple: #6d28d9;
        --orange: #f97316;
        --red: #ef4444;
        --green: #22c55e;
        --yellow: #facc15;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: sans-serif;
        color: var(--ink);
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
      #root {
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(rgba(37, 99, 235, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(37, 99, 235, 0.06) 1px, transparent 1px),
          var(--bg);
        background-size: 64px 64px;
      }
      .scene-content {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        padding: 92px 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
      }
      .chapter-kicker {
        width: max-content;
        padding: 12px 18px;
        border: 1px solid rgba(37, 99, 235, 0.22);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.74);
        color: var(--blue);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .title {
        max-width: 1280px;
        color: var(--ink);
        font-size: 92px;
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: 0;
      }
      .subtitle {
        max-width: 1040px;
        color: var(--text);
        font-size: 38px;
        line-height: 1.45;
        font-weight: 500;
        letter-spacing: 0;
      }
      .keyword-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        padding-top: 12px;
      }
      .keyword {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 54px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.86);
        color: var(--text);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .keyword::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
      }
      .keyword.ai::before {
        background: var(--orange);
      }
      .keyword.gov::before {
        background: var(--purple);
      }
      .keyword.done::before {
        background: var(--green);
      }
      .rail {
        position: absolute;
        right: 120px;
        bottom: 120px;
        width: 520px;
        height: 150px;
        border-bottom: 8px solid rgba(109, 40, 217, 0.28);
        border-left: 2px dashed rgba(37, 99, 235, 0.36);
      }
      .train-node {
        position: absolute;
        right: 176px;
        bottom: 178px;
        width: 128px;
        height: 72px;
        border-radius: 8px;
        background: var(--blue);
        box-shadow: 0 22px 50px rgba(37, 99, 235, 0.24);
      }
      .train-node::after {
        content: "AI";
        position: absolute;
        right: -26px;
        top: -24px;
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--orange);
        color: #ffffff;
        font-size: 22px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-199x" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div data-hf-id="hf-h12p" class="rail" data-layout-ignore=""></div>
      <div data-hf-id="hf-rpsu" class="train-node" data-layout-ignore=""></div>
      <section data-hf-id="hf-onrg" id="style-card" class="clip scene-content" data-start="0" data-duration="10" data-track-index="1">
        <div data-hf-id="hf-9x4l" id="kicker" class="chapter-kicker">HyperFrames 工程基线</div>
        <h1 data-hf-id="hf-4r17" id="title" class="title">AI 原生 BizDevOps 版本火车系统</h1>
        <p data-hf-id="hf-iruq" id="subtitle" class="subtitle">用技术讲解博主的方式，把多系统发布协同讲成可解释、可确认、可审计的治理机制。</p>
        <div data-hf-id="hf-f1ai" class="keyword-row">
          <span data-hf-id="hf-fkrm" id="kw-diagram" class="keyword">图解拆解</span>
          <span data-hf-id="hf-jt5q" id="kw-ai" class="keyword ai">AI 点缀</span>
          <span data-hf-id="hf-6e42" id="kw-governance" class="keyword gov">治理可信</span>
          <span data-hf-id="hf-l4xg" id="kw-proof" class="keyword done">截图证明</span>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
